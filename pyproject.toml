[project]
name = "katana-mcp"
version = "0.1.0"
description = "Katanapim MCP server for ChatGPT Apps SDK with React widget"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pymssql>=2.3.0",
]

[project.scripts]
katana-mcp = "katana_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katana_mcp"]
